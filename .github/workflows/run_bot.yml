name: Run AQW Bot

on:
  workflow_dispatch:
    inputs:
      server:
        description: AQW server name, such as Artix
        required: true
        type: string
      bot_path:
        description: Python bot module, such as bot.nulgath.larvae
        required: true
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt

    - name: Run Bot Script
      env:
        USER_NAME: ${{ secrets.AQW_USERNAME }}
        PASSWORD: ${{ secrets.AQW_PASSWORD }}
        SERVER: ${{ inputs.server }}
        BOT_PATH: ${{ inputs.bot_path }}
      run: python start.py
